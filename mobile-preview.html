<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FamiTube Android App Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" />
  <style>
    :root {
      --pink: #FF2E93;
      --pink-light: #FF6EB4;
      --blue: #00B4D8;
      --yellow: #FFD166;
      --green: #06D6A0;
      --page-bg: #F8FAFC;
      --page-bg-accent: #EFF6FF;
      --panel-bg: rgba(255, 255, 255, 0.92);
      --panel-border: #E2E8F0;
      --page-text: #0F172A;
      --page-muted: #64748B;
      --ctrl-bg: #F1F5F9;
      --ctrl-border: #CBD5E1;
      --ctrl-text: #475569;
    }
    :root[data-theme="dark"] {
      --page-bg: #0b1120;
      --page-bg-accent: #172554;
      --panel-bg: rgba(15, 23, 42, 0.88);
      --panel-border: #1f2937;
      --page-text: #f8fafc;
      --page-muted: #94a3b8;
      --ctrl-bg: #1e293b;
      --ctrl-border: #334155;
      --ctrl-text: #cbd5e1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: radial-gradient(circle at top, var(--page-bg-accent) 0%, var(--page-bg) 60%);
      color: var(--page-text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      padding: 0.9rem 1.5rem;
      background: var(--panel-bg);
      border-bottom: 1px solid var(--panel-border);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      text-decoration: none;
      color: var(--page-text);
      font-family: 'Fredoka', sans-serif;
      font-weight: 700;
      font-size: 1.2rem;
    }
    .brand-icon {
      width: 34px; height: 34px; border-radius: 10px;
      display: inline-flex; align-items: center; justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }
    .brand-icon img {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      flex-wrap: wrap;
    }
    .ctrl-group {
      display: inline-flex;
      background: var(--ctrl-bg);
      padding: 3px;
      border-radius: 99px;
      border: 1px solid var(--ctrl-border);
      gap: 2px;
    }
    .ctrl-btn {
      border: none;
      background: transparent;
      color: var(--ctrl-text);
      padding: 0.36rem 0.8rem;
      border-radius: 99px;
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }
    .ctrl-btn.active {
      background: var(--pink);
      color: #fff;
    }
    .back-link {
      color: var(--page-muted);
      text-decoration: none;
      font-size: 0.84rem;
      font-weight: 600;
      padding: 0.42rem 0.85rem;
      border-radius: 99px;
      border: 1px solid var(--ctrl-border);
      background: var(--panel-bg);
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }
    .back-link:hover { color: var(--page-text); border-color: var(--pink); }

    .workspace {
      flex: 1;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 2rem;
      padding: 1.75rem 1.25rem 2.5rem;
      flex-wrap: wrap;
    }

    /* Device Frame */
    .device-shell {
      width: 390px;
      height: 800px;
      border-radius: 42px;
      padding: 12px;
      background: linear-gradient(145deg, #334155, #0f172a);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.65), inset 0 0 0 2px rgba(255,255,255,0.08);
      display: flex;
      flex-direction: column;
      transition: width 0.25s ease, height 0.25s ease, border-radius 0.25s ease;
    }
    .device-shell.tablet {
      width: 720px;
      height: 880px;
      border-radius: 28px;
    }
    .device-screen {
      flex: 1;
      border-radius: 32px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      /* Light theme defaults */
      --bg: #F8FAFC;
      --surface: #FFFFFF;
      --surface-var: #F1F5F9;
      --text: #0F172A;
      --text-muted: #64748B;
      --border: #E2E8F0;
      background: var(--bg);
      color: var(--text);
    }
    .device-shell.tablet .device-screen { border-radius: 20px; }
    .device-screen.dark {
      --bg: #0B1120;
      --surface: #131B2E;
      --surface-var: #1E293B;
      --text: #F8FAFC;
      --text-muted: #94A3B8;
      --border: #1E293B;
    }

    /* Android Status Bar */
    .android-status {
      height: 28px;
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.72rem;
      font-weight: 700;
      background: var(--surface);
      color: var(--text);
      flex-shrink: 0;
    }
    .camera-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: #020617;
      border: 1px solid #334155;
    }

    /* FamiTubeTopBar */
    .app-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .app-topbar-left { display: flex; align-items: center; gap: 8px; }
    .app-logo {
      width: 32px; height: 32px; border-radius: 9px;
      background: linear-gradient(135deg, var(--pink), var(--pink-light));
      color: #fff; font-weight: 800; font-size: 1rem;
      display: flex; align-items: center; justify-content: center;
    }
    .app-title { font-weight: 800; font-size: 1.05rem; }
    .app-topbar-actions { display: flex; align-items: center; gap: 5px; }
    .pill-stars {
      background: rgba(255, 209, 102, 0.22);
      color: #B45309;
      padding: 4px 8px;
      border-radius: 99px;
      font-size: 0.72rem;
      font-weight: 800;
      border: none;
      cursor: pointer;
    }
    .device-screen.dark .pill-stars { color: #FFD166; }
    .pill-time {
      background: var(--surface-var);
      color: #0284C7;
      padding: 4px 8px;
      border-radius: 99px;
      font-size: 0.72rem;
      font-weight: 800;
    }
    .icon-btn {
      width: 30px; height: 30px; border-radius: 50%;
      border: none; background: transparent;
      color: var(--text);
      display: inline-flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .icon-btn:hover { background: var(--surface-var); }

    /* Scrollable App Content */
    .app-body {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
    }
    .app-body::-webkit-scrollbar { width: 5px; }
    .app-body::-webkit-scrollbar-thumb { background: rgba(148,163,184,0.35); border-radius: 99px; }

    /* Bottom Navigation Bar */
    .app-bottombar {
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 6px 4px 10px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    .nav-item {
      border: none;
      background: transparent;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      font-family: inherit;
      font-size: 0.66rem;
      font-weight: 700;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 12px;
    }
    .nav-item.active {
      color: var(--pink);
      background: rgba(255, 46, 147, 0.1);
    }

    /* App Cards & Components */
    .hero-banner {
      background: linear-gradient(135deg, rgba(255,46,147,0.14), rgba(0,180,216,0.14));
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .chips-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 10px;
    }
    .chip {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      padding: 5px 12px;
      border-radius: 99px;
      font-size: 0.74rem;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
    }
    .chip.active { background: var(--pink); color: #fff; border-color: var(--pink); }
    .video-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }
    .device-shell.tablet .video-list {
      grid-template-columns: repeat(2, 1fr);
    }
    .v-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
    }
    .v-thumb {
      position: relative;
      aspect-ratio: 16/9;
      background: #0f172a;
      overflow: hidden;
    }
    .v-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .v-badge {
      position: absolute;
      bottom: 8px; right: 8px;
      background: rgba(0,0,0,0.78);
      color: #fff;
      font-size: 0.68rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 6px;
    }
    .v-info { padding: 10px 12px; }
    .v-title { font-weight: 700; font-size: 0.86rem; line-height: 1.3; margin-bottom: 4px; }
    .v-meta { font-size: 0.74rem; color: var(--text-muted); }

    .card-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .btn-primary {
      background: var(--pink);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 10px 14px;
      font-family: inherit;
      font-weight: 700;
      font-size: 0.82rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-outline {
      background: var(--surface-var);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 9px 12px;
      font-family: inherit;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .theme-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 10px;
    }
    .theme-tile {
      border: 1.5px solid var(--border);
      background: var(--surface-var);
      color: var(--text);
      border-radius: 12px;
      padding: 10px 6px;
      text-align: center;
      cursor: pointer;
      font-size: 0.76rem;
      font-weight: 700;
    }
    .theme-tile.active {
      border-color: var(--pink);
      background: rgba(255, 46, 147, 0.12);
      color: var(--pink);
    }
    .badge-trusted {
      display: inline-flex; align-items: center; gap: 4px;
      background: rgba(6, 214, 160, 0.16); color: #06D6A0;
      border: 1px solid rgba(6, 214, 160, 0.35);
      border-radius: 99px; padding: 2px 8px; font-size: 0.68rem; font-weight: 800;
    }
    .badge-supervised {
      display: inline-flex; align-items: center; gap: 4px;
      background: rgba(245, 158, 11, 0.16); color: #F59E0B;
      border: 1px solid rgba(245, 158, 11, 0.35);
      border-radius: 99px; padding: 2px 8px; font-size: 0.68rem; font-weight: 800;
    }
    .badge-blocked {
      display: inline-flex; align-items: center; gap: 4px;
      background: rgba(239, 68, 68, 0.16); color: #EF4444;
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-radius: 99px; padding: 2px 8px; font-size: 0.68rem; font-weight: 800;
    }
    .subtabs {
      display: flex;
      border-bottom: 2px solid var(--border);
      margin-bottom: 12px;
    }
    .subtab-btn {
      flex: 1;
      padding: 8px 10px;
      border: none;
      background: transparent;
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      text-align: center;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }
    .subtab-btn.active {
      color: var(--pink);
      border-bottom-color: var(--pink);
    }

    /* YouTube Style Tabs (Screenshot Reference) */
    .yt-tab-bar {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 0 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .yt-tab-bar::-webkit-scrollbar {
      display: none;
    }
    .yt-tab-item {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 0 0 0;
      cursor: pointer;
      font-size: 0.94rem;
      font-weight: 500;
      color: var(--text-muted);
      transition: color 0.15s ease;
      background: none;
      border: none;
      outline: none;
      font-family: inherit;
    }
    .yt-tab-item.active {
      font-weight: 800;
      color: var(--text);
    }
    .yt-tab-indicator {
      height: 3px;
      width: 100%;
      border-radius: 2px 2px 0 0;
      background: transparent;
      margin-top: 8px;
      transition: background 0.15s ease;
    }
    .yt-tab-item.active .yt-tab-indicator {
      background: var(--pink);
    }

    .ch-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .ch-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 12px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    .ch-card:hover {
      transform: translateY(-2px);
      border-color: var(--blue);
    }
    .ch-close-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.82rem;
      font-weight: 800;
    }
    .ch-close-btn:hover {
      color: var(--pink);
      background: rgba(255,46,147,0.12);
    }
    .simple-topics-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 10px;
    }
    .simple-topic-tile {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 20px;
      padding: 18px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-align: center;
      transition: transform 0.15s ease;
    }
    .simple-topic-tile:hover {
      transform: scale(1.03);
    }

    /* Side Inspector Panel */
    .inspector {
      width: 310px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 20px;
      padding: 1.25rem;
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.06);
    }
    .inspector h3 {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.15rem;
      margin-bottom: 0.4rem;
    }
    .inspector p { font-size: 0.84rem; color: var(--page-muted); line-height: 1.5; margin-bottom: 1rem; }
    .quick-screens { display: flex; flex-direction: column; gap: 0.45rem; }
    .qs-btn {
      text-align: left;
      background: var(--ctrl-bg);
      color: var(--page-text);
      border: 1px solid var(--ctrl-border);
      border-radius: 10px;
      padding: 0.55rem 0.8rem;
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .qs-btn:hover { border-color: var(--pink); color: var(--pink); }

    @media (max-width: 520px) {
      .topbar {
        padding: 0.6rem 0.8rem;
      }
      .controls {
        gap: 0.35rem;
      }
      .ctrl-btn {
        padding: 5px 8px;
        font-size: 0.76rem;
      }
      .workspace {
        padding: 0.75rem 0.5rem 1.5rem;
        gap: 1.25rem;
      }
      .device-shell {
        width: 100%;
        max-width: 390px;
        height: 720px;
        border-radius: 28px;
        padding: 8px;
      }
      .device-screen {
        border-radius: 20px;
      }
      .inspector {
        width: 100%;
        max-width: 390px;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a href="index.html" class="brand">
      <span class="brand-icon"><img src="assets/famitube-icon.png" alt="FamiTube"></span>
      <span>FamiTube Mobile Preview</span>
      <span id="previewAppVersion" style="font-family:inherit; font-size:0.74rem; font-weight:800; padding:2px 8px; border-radius:99px; background:rgba(255,46,147,0.18); color:#ff6eb4; border:1px solid rgba(255,46,147,0.35);">v1.0.0</span>
    </a>

    <div class="controls">
      <div class="ctrl-group">
        <button class="ctrl-btn active" id="btnPhone" onclick="setDevice('phone')">
          <span class="material-symbols-rounded" style="font-size:1rem;">smartphone</span> Phone
        </button>
        <button class="ctrl-btn" id="btnTablet" onclick="setDevice('tablet')">
          <span class="material-symbols-rounded" style="font-size:1rem;">tablet_android</span> Tablet
        </button>
      </div>

      <div class="ctrl-group">
        <button class="ctrl-btn" id="btnThemeLight" onclick="setAppTheme('LIGHT')">Light</button>
        <button class="ctrl-btn active" id="btnThemeDark" onclick="setAppTheme('DARK')">Dark</button>
      </div>

      <div class="ctrl-group" role="group" aria-label="Kid Age Group">
        <button class="ctrl-btn" id="btnAgeAll" onclick="setAgeMode('ALL')">All Ages</button>
        <button class="ctrl-btn" id="btnAgeToddler" onclick="setAgeMode('TODDLER')">Toddler (2–4)</button>
        <button class="ctrl-btn" id="btnAgeYoung" onclick="setAgeMode('YOUNG_KIDS')">Young Kids (5–8)</button>
        <button class="ctrl-btn active" id="btnAgeOlder" onclick="setAgeMode('OLDER_KIDS')">Older Kids (9–12)</button>
      </div>

      <a href="index.html" class="back-link">
        <span class="material-symbols-rounded" style="font-size:1rem;">arrow_back</span> Back to Web Portal
      </a>
    </div>
  </header>

  <main class="workspace">
    <div class="device-shell" id="deviceShell">
      <div class="device-screen dark" id="deviceScreen">
        <div class="android-status">
          <span>11:42</span>
          <span class="camera-dot" title="Front Camera Attention Tracker"></span>
          <span>5G • 94%</span>
        </div>

        <div class="app-topbar" id="appTopBar">
          <div class="app-topbar-left">
            <div class="app-logo" style="overflow:hidden; padding:0; background:none; border-radius:10px;"><img src="assets/famitube-icon.png" style="width:100%; height:100%; object-fit:cover;"></div>
            <span class="app-title">FamiTube</span>
          </div>
          <div class="app-topbar-actions">
            <button class="icon-btn" id="btnTopNotif" onclick="navigate('notifications')" title="Notifications" style="position:relative;">
              <span class="material-symbols-rounded" style="font-size:1.25rem;">notifications</span>
              <span id="topNotifBadge" style="position:absolute; top:2px; right:2px; min-width:14px; height:14px; border-radius:99px; background:var(--pink); color:#fff; font-size:0.58rem; font-weight:800; display:flex; align-items:center; justify-content:center; padding:0 3px;">2</span>
            </button>
            <button class="icon-btn" id="btnTopSearch" onclick="navigate('search')" title="Search">
              <span class="material-symbols-rounded" style="font-size:1.25rem;">search</span>
            </button>
          </div>
        </div>

        <div class="app-body" id="appBody"></div>

        <nav class="app-bottombar" id="appBottomBar"></nav>
      </div>
    </div>

    <aside class="inspector">
      <h3>Interactive APK Simulator</h3>
      <p id="dataSourceNote">Connecting to FamiTube API to load live curated channels and videos...</p>
      <div class="quick-screens">
        <button class="qs-btn" onclick="navigate('login')"><span>🔐 Login (Child / Parent)</span><span>›</span></button>
        <button class="qs-btn" onclick="navigate('parent_dashboard')"><span>🛡️ Parent Mode Dashboard</span><span>›</span></button>
        <button class="qs-btn" onclick="state.parentTab='activity'; navigate('parent_dashboard');"><span>📊 Child Activity &amp; @Trust Tiers</span><span>›</span></button>
        <button class="qs-btn" onclick="navigate('home')"><span>🏠 Home Feed (Child Mode)</span><span>›</span></button>

    async function syncAndroidVersionFromRepo() {
      try {
        const relRes = await fetch('https://api.github.com/repos/renowijoyo/famitube-android/releases/latest', { cache: 'no-store' });
        if (relRes.ok) {
          const rel = await relRes.json();
          const apkAsset = (rel.assets || []).find(a => /FamiTube-v([^-]+)-/.test(a.name || ''));
          const assetMatch = apkAsset?.name?.match(/FamiTube-v([^-]+)-/);
          if (assetMatch && assetMatch[1]) {
            state.appVersion = assetMatch[1];
            const badge = document.getElementById('previewAppVersion');
            if (badge) badge.textContent = `v${state.appVersion}`;
            render();
            return;
          }
        }
        const res = await fetch('https://raw.githubusercontent.com/renowijoyo/famitube-android/main/app/build.gradle.kts', { cache: 'no-store' });
        if (!res.ok) return;
        const text = await res.text();
        const match = text.match(/versionName\s*=\s*"([^"]+)"/);
        if (match && match[1]) {
          state.appVersion = match[1];
          const badge = document.getElementById('previewAppVersion');
          if (badge) badge.textContent = `v${state.appVersion}`;
          render();
        }
      } catch {
        // Keep fallback version
      }
    }

    async function loadLiveBackendData() {
      const noteEl = document.getElementById('dataSourceNote');
      try {
        const [vidRes, chRes] = await Promise.all([
          fetch(`${API_BASE}/api/videos`).then(r => r.json()),
          fetch(`${API_BASE}/api/channels`).then(r => r.json())
        ]);
        if (vidRes.success && vidRes.data?.length) {
          state.videos = [...vidRes.data].sort((a, b) => (Date.parse(b.createdAt) || 0) - (Date.parse(a.createdAt) || 0));
          state.activeVideo = state.videos[0];
        }
        if (chRes.success && chRes.data?.length) {
          state.channels = chRes.data;
        }
        if (authToken) {
          const achRes = await fetch(`${API_BASE}/api/kids/achievements`, {
            headers: { Authorization: `Bearer ${authToken}` }
          }).then(r => r.json()).catch(() => null);
          if (achRes?.success && achRes.data) {
            state.stars = achRes.data.stars ?? state.stars;
          }
          const ytRes = await fetch(`${API_BASE}/api/kids/youtube-subscriptions`, {
            headers: { Authorization: `Bearer ${authToken}` }
          }).then(r => r.json()).catch(() => null);
          if (ytRes?.success && Array.isArray(ytRes.data) && ytRes.data.length) {
            state.ytSubscribedChannels = ytRes.data;
          }
        }
        if (noteEl) noteEl.textContent = `Synced live with ${API_BASE} (${state.videos.length} videos, ${state.channels.length} curated, ${state.ytSubscribedChannels.length} @YouTube).`;
      } catch {
        if (noteEl) noteEl.textContent = 'Using built-in offline sample catalog (API unreachable).';
      }
      render();
    }

    function topicEmoji(name) {
      const lower = String(name || '').toLowerCase();
      if (lower.includes('animal') || lower.includes('nature')) return '🦁';
      if (lower.includes('cartoon') || lower.includes('fun')) return '🎨';
      if (lower.includes('craft') || lower.includes('art')) return '✂️';
      if (lower.includes('discovery') || lower.includes('world')) return '🌍';
      if (lower.includes('yoga') || lower.includes('active')) return '🤸';
      if (lower.includes('learn') || lower.includes('abc')) return '📚';
      if (lower.includes('music') || lower.includes('rhyme')) return '🎵';
      if (lower.includes('science') || lower.includes('space')) return '🚀';
      if (lower.includes('math') || lower.includes('coding')) return '🔢';
      if (lower.includes('stor') || lower.includes('read')) return '📖';
      if (lower.includes('game') || lower.includes('gaming')) return '🎮';
      if (lower.includes('hobb') || lower.includes('diy')) return '🛠️';
      if (lower.includes('sport') || lower.includes('outdoor')) return '⚽';
      if (lower.includes('cook') || lower.includes('bak')) return '🧁';
      return '🎬';
    }

    function matchesPreviewAge(rating) {
      if (state.ageMode === 'ALL') return true;
      const r = String(rating || 'ALL').toUpperCase();
      return r === state.ageMode || r === 'ALL';
    }

    function formatPreviewAgeLabel(rating) {
      const r = String(rating || 'ALL').toUpperCase();
      if (r === 'TODDLER') return 'Ages 2-4';
      if (r === 'YOUNG_KIDS') return 'Ages 5-8';
      if (r === 'OLDER_KIDS') return 'Ages 9-12';
      return 'All Ages';
    }

    function navigate(screen, extra) {
      state.screen = screen;
      if (screen === 'library' || screen === 'playlists') {
        state.selectedCustomPlaylistId = null;
      }
      if (extra?.video) state.activeVideo = extra.video;
      if (screen !== 'player') state.isAttentionPaused = false;
      render();
    }

    function togglePreviewFavorite(videoId) {
      if (!state.favoriteVideoIds) state.favoriteVideoIds = [];
      const idx = state.favoriteVideoIds.indexOf(videoId);
      if (idx >= 0) {
        state.favoriteVideoIds.splice(idx, 1);
      } else {
        state.favoriteVideoIds.push(videoId);
      }
      render();
    }

    function isPreviewFavorite(videoId) {
      return (state.favoriteVideoIds || []).includes(videoId);
    }

    function createCustomPlaylist(title) {
      if (!title || !title.trim()) return null;
      const pl = {
        id: 'cpl-' + Date.now(),
        title: title.trim(),
        items: []
      };
      state.customPlaylists.unshift(pl);
      render();
      return pl;
    }

    function addVideoToCustomPlaylist(playlistId, video) {
      const pl = state.customPlaylists.find(p => p.id === playlistId);
      if (!pl || !video) return false;
      const key = video.id || video.youtubeVideoId || ('item_' + Date.now());
      if (pl.items.some(it => it.key === key || it.videoId === video.id || (video.youtubeVideoId && it.youtubeVideoId === video.youtubeVideoId))) {
        return true;
      }
      pl.items.push({
        key,
        videoId: video.id,
        youtubeVideoId: video.youtubeVideoId,
        title: video.title,
        channelTitle: video.channelTitle,
        thumbnailUrl: video.thumbnailUrl
      });
      render();
      return true;
    }

    function removeVideoFromCustomPlaylist(playlistId, key) {
      const pl = state.customPlaylists.find(p => p.id === playlistId);
      if (!pl) return;
      pl.items = pl.items.filter(it => it.key !== key && it.videoId !== key);
      render();
    }

    function deleteCustomPlaylist(playlistId) {
      if (confirm('Delete this list?')) {
        state.customPlaylists = state.customPlaylists.filter(p => p.id !== playlistId);
        if (state.selectedCustomPlaylistId === playlistId) state.selectedCustomPlaylistId = null;
        render();
      }
    }

    function openSaveToLibraryModal(videoId) {
      const v = state.videos.find(x => x.id === videoId) || state.activeVideo;
      if (!v) return;
      if (state.customPlaylists.length === 0) {
        const title = prompt('Create a new list to save this video:');
        if (title && title.trim()) {
          const pl = createCustomPlaylist(title);
          addVideoToCustomPlaylist(pl.id, v);
          alert(`Saved to "${pl.title}"!`);
        }
        return;
      }
      const listNames = state.customPlaylists.map((p, idx) => `${idx + 1}. ${p.title} (${p.items.length} videos)`).join('\n');
      const choice = prompt(`Save "${v.title}" to a list:\n\n${listNames}\n\nEnter number (1-${state.customPlaylists.length}) or type a new list name:`);
      if (!choice || !choice.trim()) return;
      const num = parseInt(choice.trim(), 10);
      if (!isNaN(num) && num >= 1 && num <= state.customPlaylists.length) {
        const targetPl = state.customPlaylists[num - 1];
        addVideoToCustomPlaylist(targetPl.id, v);
        alert(`Saved to "${targetPl.title}"!`);
      } else {
        const pl = createCustomPlaylist(choice.trim());
        addVideoToCustomPlaylist(pl.id, v);
        alert(`Saved to "${pl.title}"!`);
      }
    }

      const idx = state.ytSubscribedChannels.findIndex(c => c.handle.toLowerCase() === ch.handle.toLowerCase());
      if (idx >= 0) {
        state.ytSubscribedChannels.splice(idx, 1);

        state.ytSubscribedChannels.unshift({
          id: 'yt-' + Date.now(),

          title: ch.title || ch.handle.replace('@', ''),
          avatarUrl: ch.avatarUrl || 'https://images.unsplash.com/photo-1507668077129-56e32842fceb?w=200&h=200&fit=crop',

    function playYtVideo(video, channelHandle) {
      const sub = state.ytSubscribedChannels.find(c => c.handle.toLowerCase() === (channelHandle || video.handle || '').toLowerCase());
      const trust = sub ? sub.trustLevel : 'SUPERVISED';
      if (trust === 'BLOCKED') {
        alert(`🚫 Access Blocked: ${channelHandle || 'This channel'} has been blocked by your parent.`);
        return;
      }
      if (trust === 'SUPERVISED') {
        const exists = state.parentRequests.some(r => r.title === video.title);
        if (!exists) {
          const ytId = video.youtubeVideoId || video.id || (video.thumbnailUrl ? (video.thumbnailUrl.match(/vi\/([^\/]+)/) || [])[1] : '') || '';
          state.parentRequests.unshift({
            id: 'req-' + Date.now(),
            title: video.title,
            channelTitle: channelHandle || video.channelTitle,
            kidName: state.selectedActivityKid || 'Leo',
            thumbnailUrl: video.thumbnailUrl,
            youtubeVideoId: ytId,
            status: 'PENDING'
          });
        }
        alert(`👁️ Video Supervised!\n\nA watch request for "${video.title}" has been sent to your parent's dashboard.`);
        return;
      }
      navigate('player', { video: {
        id: video.id,
        title: video.title,
        channelTitle: channelHandle || video.channelTitle,
        category: 'YouTube Channel',
        thumbnailUrl: video.thumbnailUrl,
        duration: video.duration || 300,
        ageRating: state.ageMode
      }});
    }

                  <div style="display:flex; align-items:center; gap:6px;">
                    <span style="font-size:1.1rem;">👁️</span>
                    <span style="font-weight:800; font-size:0.95rem;">Parent Preview • Video Request</span>
                  </div>
                  <button class="btn-outline" style="padding:2px 8px; border-radius:50%; font-size:0.9rem; cursor:pointer;" onclick="state.parentPreviewRequest=null; render();">✕</button>
                </div>

                <div style="position:relative; width:100%; aspect-ratio:16/9; background:#000; border-radius:12px; overflow:hidden; margin-bottom:12px;">
                  ${state.parentPreviewRequest.youtubeVideoId ? `
                    <iframe width="100%" height="100%" src="https://www.youtube-nocookie.com/embed/${state.parentPreviewRequest.youtubeVideoId}?autoplay=1&enablejsapi=1" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen style="border:none; width:100%; height:100%;"></iframe>
                  ` : `
                    <img src="${state.parentPreviewRequest.thumbnailUrl}" style="width:100%; height:100%; object-fit:cover;">
                    <div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,0.35);">
                      <span style="color:#fff; font-size:2.2rem;">▶</span>
                    </div>
                  `}
                </div>

                <div style="font-weight:800; font-size:0.92rem; margin-bottom:4px; line-height:1.3;">${state.parentPreviewRequest.title}</div>
                <div style="font-size:0.75rem; color:var(--text-muted); margin-bottom:14px;">
                  <strong>${state.parentPreviewRequest.channelTitle}</strong> • Requested by <strong>${state.parentPreviewRequest.kidName}</strong>
                </div>

                ${state.parentPreviewRequest.status === 'PENDING' ? `
                  <div style="display:flex; gap:10px;">
                    <button class="btn-outline" style="flex:1; border-color:var(--pink); color:var(--pink); padding:8px;" onclick="state.parentRequests=state.parentRequests.map(x=>x.id==='${state.parentPreviewRequest.id}'?{...x,status:'REJECTED'}:x); state.parentPreviewRequest=null; render();">✕ Decline</button>
                    <button class="btn-primary" style="flex:1; background:#06D6A0; color:#0B1120; padding:8px;" onclick="state.parentRequests=state.parentRequests.map(x=>x.id==='${state.parentPreviewRequest.id}'?{...x,status:'APPROVED'}:x); state.parentPreviewRequest=null; render();">✓ Approve Video</button>
                  </div>
                ` : `
                  <div style="display:flex; align-items:center; justify-content:space-between;">
                    <span style="font-size:0.75rem; font-weight:800; padding:4px 8px; border-radius:6px; background:${state.parentPreviewRequest.status==='APPROVED'?'rgba(6,214,160,0.16)':'rgba(255,46,147,0.16)'}; color:${state.parentPreviewRequest.status==='APPROVED'?'#06D6A0':'#FF2E93'};">Status: ${state.parentPreviewRequest.status}</span>
                    <button class="btn-outline" onclick="state.parentPreviewRequest=null; render();">Close Preview</button>
                  </div>
                `}
              </div>
            </div>
          ` : ''}
        `;
      } else if (state.screen === 'parental_gate') {
        body.innerHTML = `
          <button class="btn-outline" onclick="navigate('home')" style="margin-bottom:12px;">← Back</button>
          <div class="card-box" style="text-align:center; padding:22px 16px;">
            <div style="font-size:2rem; margin-bottom:8px;">🔒</div>
            <div style="font-weight:800; font-size:1rem; margin-bottom:4px;">Grown-Ups Only</div>
            <div style="font-size:0.76rem; color:var(--text-muted); margin-bottom:14px;">Enter 4-digit Parent PIN (default: 1234)</div>
            <input type="password" maxlength="4" value="${state.pinInput}" oninput="state.pinInput=this.value;" placeholder="••••" style="text-align:center; font-size:1.3rem; letter-spacing:8px; width:140px; padding:10px; border-radius:12px; border:1px solid var(--border); background:var(--surface-var); color:var(--text); margin-bottom:12px;">
            <div>
              <button class="btn-primary" onclick="if(state.pinInput==='1234'){navigate('parental_settings');}else{alert('Try PIN 1234');}">Unlock Settings</button>
            </div>
          </div>
        `;
      } else if (state.screen === 'parental_settings') {
        body.innerHTML = `
          <button class="btn-outline" onclick="navigate('home')" style="margin-bottom:10px;">← Done</button>
          <div class="card-box">
            <div style="font-weight:800; font-size:0.95rem; margin-bottom:8px;">Kid Age Group</div>
            <div class="chips-row">
              ${[
                { id: 'ALL', label: 'All Ages' },
                { id: 'TODDLER', label: 'Toddler (2–4)' },
                { id: 'YOUNG_KIDS', label: 'Young Kids (5–8)' },
                { id: 'OLDER_KIDS', label: 'Older Kids (9–12)' }
              ].map(a => `<button class="chip ${state.ageMode===a.id?'active':''}" onclick="setAgeMode('${a.id}');">${a.label}</button>`).join('')}
            </div>
          </div>
          <div class="card-box">
            <div style="font-weight:800; font-size:0.95rem; margin-bottom:8px;">Daily Watch Time Limit</div>
            <div class="chips-row">
              ${[15,30,45,60,90,120].map(m => `<button class="chip ${state.dailyLimit===m?'active':''}" onclick="state.dailyLimit=${m}; render();">${m}m</button>`).join('')}
            </div>
          </div>
          <div class="card-box">
            <div style="font-weight:800; font-size:0.95rem; margin-bottom:6px;">Camera Attention Check</div>
            <label style="display:flex; align-items:center; gap:8px; font-size:0.82rem; cursor:pointer;">
              <input type="checkbox" ${state.attentionEnabled?'checked':''} onchange="state.attentionEnabled=this.checked; render();">
              Auto-pause when viewer looks away
            </label>
          </div>
        `;
      } else {
        // Library (Child Custom Playlists)
        const selectedPl = state.customPlaylists.find(p => p.id === state.selectedCustomPlaylistId);
        if (selectedPl) {
          body.innerHTML = `
            <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;">
              <button class="btn-outline" onclick="state.selectedCustomPlaylistId=null; render();">← Back to Library</button>
              <button class="btn-outline" style="color:var(--pink); border-color:var(--pink); padding:4px 8px; font-size:0.74rem;" onclick="deleteCustomPlaylist('${selectedPl.id}')">Delete List</button>
            </div>
            <div style="margin-bottom:14px;">
              <div style="font-weight:800; font-size:1.15rem;">${selectedPl.title}</div>
              <div style="font-size:0.78rem; color:var(--text-muted);">${selectedPl.items.length} safe videos in this list</div>
            </div>
            ${selectedPl.items.length === 0 ? `
              <div class="card-box" style="text-align:center; padding:32px 16px;">
                <div style="font-size:2rem; margin-bottom:8px;">📁</div>
                <div style="font-weight:800; font-size:0.95rem; margin-bottom:4px;">No videos in this list yet</div>
                <div style="font-size:0.76rem; color:var(--text-muted);">When watching any video in the Player, tap "Save to List" to add it here!</div>
              </div>
            ` : `
              <div style="display:flex; flex-direction:column; gap:8px;">
                ${selectedPl.items.map((item, idx) => `
                  <div class="card-box" style="display:flex; align-items:center; gap:10px; cursor:pointer;" onclick="openPreviewVideo('${item.videoId || item.key}')">
                    <img src="${item.thumbnailUrl}" style="width:72px; height:46px; border-radius:8px; object-fit:cover;">
                    <div style="flex:1; min-width:0;">
                      <div style="font-weight:700; font-size:0.82rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${item.title}</div>
                      <div style="font-size:0.72rem; color:var(--text-muted);">${item.channelTitle || 'YouTube'}</div>
                    </div>
                    <button class="btn-outline" style="padding:4px 6px; font-size:0.7rem; color:var(--text-muted);" onclick="event.stopPropagation(); removeVideoFromCustomPlaylist('${selectedPl.id}', '${item.key}')" title="Remove">✕</button>
                  </div>
                `).join('')}
              </div>
            `}
          `;
        } else {
          body.innerHTML = `
            <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;">
              <div>
                <div style="font-weight:800; font-size:1.1rem;">My Library</div>
                <div style="font-size:0.74rem; color:var(--text-muted);">Your custom lists and saved videos</div>
              </div>
              <button class="btn-primary" style="padding:6px 12px; font-size:0.78rem;" onclick="const t = prompt('Enter new list name:'); if (t) createCustomPlaylist(t);">+ New List</button>
            </div>
            ${state.customPlaylists.length === 0 ? `
              <div class="card-box" style="text-align:center; padding:36px 16px;">
                <div style="font-size:2.4rem; margin-bottom:8px;">📚</div>
                <div style="font-weight:800; font-size:1rem; margin-bottom:4px;">Your Library is Empty</div>
                <div style="font-size:0.76rem; color:var(--text-muted); margin-bottom:14px;">Create your own lists and save videos to watch anytime!</div>
                <button class="btn-primary" onclick="const t = prompt('Enter new list name:'); if (t) createCustomPlaylist(t);">Create New List</button>
              </div>
            ` : `
              <div style="display:flex; flex-direction:column; gap:10px;">
                ${state.customPlaylists.map(pl => {
                  const firstItem = pl.items[0];
                  return `
                    <div class="card-box" style="display:flex; align-items:center; gap:12px; cursor:pointer;" onclick="state.selectedCustomPlaylistId='${pl.id}'; render();">
                      <div style="width:68px; height:48px; border-radius:8px; background:rgba(255,46,147,0.15); display:flex; align-items:center; justify-content:center; overflow:hidden;">
                        ${firstItem && firstItem.thumbnailUrl ? `<img src="${firstItem.thumbnailUrl}" style="width:100%; height:100%; object-fit:cover;">` : `<span class="material-symbols-rounded" style="color:var(--pink); font-size:1.5rem;">video_library</span>`}
                      </div>
                      <div style="flex:1; min-width:0;">
                        <div style="font-weight:800; font-size:0.9rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${pl.title}</div>
                        <div style="font-size:0.74rem; color:var(--blue); font-weight:700;">${pl.items.length} videos</div>
                      </div>
                      <button class="btn-outline" style="padding:4px 8px; font-size:0.72rem; color:var(--text-muted);" onclick="event.stopPropagation(); deleteCustomPlaylist('${pl.id}')">Delete</button>
                    </div>
                  `;
                }).join('')}
              </div>
            `}
          `;
        }
      }
    }

    setAppTheme(state.theme || 'DARK');
    syncAndroidVersionFromRepo();
    loadLiveBackendData();
    render();
  </script>
</body>
</html>
